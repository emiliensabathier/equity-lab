# Per-address budget at the edge, ahead of the app's own limits: search is typed live (debounced
# at 250 ms) and the narrative is polled every 5 s, so 5 requests a second with a burst of 20
# never trims a reader. This line sits at http level, which a sites-enabled file is included in.
limit_req_zone $binary_remote_addr zone=elab_api:10m rate=5r/s;

server {
    listen 80;
    # Placeholder: replace with the real domain. Then run certbot (certbot --nginx) to add TLS.
    server_name analyse.example.org;

    # The page loads only its own files plus Chart.js from cdnjs; it has no inline script or
    # style (Chart.js sizes its canvas through the CSSOM, which style-src does not govern).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    limit_req_status 429;

    location /api/ {
        limit_req zone=elab_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # A cold analysis fetches a few years of statements and prices: allow it the time.
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        # Overwrite, never append: the API trusts the first hop coming from loopback, so a
        # client-supplied X-Forwarded-For must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
