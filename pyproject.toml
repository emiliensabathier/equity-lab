[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elab"
version = "0.1.0"
description = "Equity analysis web app: reverse DCF, WACC, peers and health for US/EU companies"
requires-python = ">=3.11"
dependencies = [
    "vlab @ git+https://github.com/emiliensabathier/valuation-lab@6eedd4734b5939ef41faac38d78ebf14b488ae48",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "lxml>=5.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
